<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />

  <title>Jetpack Runner V7.4 — Tourelles + midgame plus dur</title>

  <!-- VIEWPORT (CRITIQUE MOBILE) -->
  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no" />

  <!-- ===== PWA ===== -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#05060a">

  <!-- ===== iOS (OBLIGATOIRE) ===== -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jetpack Runner">

  <!-- ICÔNES -->
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- STYLE -->
  <style>

 /* =========================
   BASE / GAME CANVAS
========================== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html, body{
  width:100%;
  height:100%;
  background:#05060a;
  color:#fff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:hidden;

  touch-action:none;
  overscroll-behavior:none;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

/* =========================
   GAME CONTAINER — 16:9 PERFECT
========================== */
#gameContainer{
  position:relative;
  width:720px;
  height:405px;

  border-radius:14px;
  overflow:hidden;
  border:1px solid rgba(120,180,255,.22);

  background:
    radial-gradient(circle at 50% 44%, rgba(70,170,255,.22), rgba(0,0,0,0) 48%),
    radial-gradient(circle at 50% 72%, rgba(30,90,200,.28), rgba(0,0,0,0) 64%),
    linear-gradient(180deg, rgba(6,10,26,.96), rgba(2,3,8,.99) 76%);

  box-shadow:
    0 0 0 1px rgba(0,0,0,.45) inset,
    0 0 35px rgba(0,0,0,.75),
    0 0 70px rgba(40,120,255,.18);
}

/* =========================
   CANVAS
========================== */
#game{
  width:100%;
  height:100%;
  display:block;
}

/* =========================
   UI IN-GAME
========================== */
#ui{
  position:absolute;
  top:14px;
  left:50%;
  transform:translateX(-50%);
  z-index:4;
  pointer-events:none;
  text-align:center;
}

/* SCORE */
#uiScore{
  font-size:32px;
  font-weight:900;
  letter-spacing:1px;
  color:#ffffff;
  text-shadow:
    0 2px 10px rgba(120,180,255,.35),
    0 0 18px rgba(60,140,255,.25);
}

/* =========================
   OVERDRIVE — SCORE (MOBILE SAFE)
========================== */
#uiScore{
  will-change:transform;
}

body.overdriveActive #uiScore{
  animation: scorePulse .6s ease-in-out infinite;
}

@keyframes scorePulse{
  0%{ transform:scale(1); opacity:1; }
  50%{ transform:scale(1.06); opacity:.92; }
  100%{ transform:scale(1); opacity:1; }
}

/* =========================
   OVERDRIVE — AURA CONTAINER (GPU FRIENDLY)
========================== */
#gameContainer::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
  transform:scale(1);
  will-change:transform;
}

body.overdriveActive #gameContainer::after{
  opacity:.22;
  background:
    radial-gradient(circle at center,
      rgba(140,220,255,.25),
      rgba(0,0,0,0) 65%
    );
  animation: overdriveAura 1.6s ease-in-out infinite;
}

@keyframes overdriveAura{
  0%{ transform:scale(1); }
  50%{ transform:scale(1.06); }
  100%{ transform:scale(1); }
}

/* =========================
   OVERDRIVE METER (OPTIMISÉ)
========================== */
#overdriveMeter{
  position:absolute;
  right:22px;
  top:60%;
  transform:translateY(-50%);
  width:24px;
  height:180px;
  z-index:25;
  pointer-events:none;
}

#overdriveLabel{
  position:absolute;
  top:-26px;
  left:50%;
  transform:translateX(-50%);
  font-size:9px;
  letter-spacing:2px;
  color:#cfefff;
  opacity:.85;
  text-shadow:0 0 4px rgba(120,220,255,.6);
}

#overdriveBarOuter{
  position:relative;
  width:100%;
  height:100%;
  border-radius:999px;
  background:rgba(0,0,0,.65);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:inset 0 0 10px rgba(0,0,0,.85);
  overflow:hidden;
}

#overdriveBarInner{
  position:absolute;
  bottom:0;
  width:100%;
  height:0%;
  border-radius:999px;
  background:linear-gradient(
    180deg,
    #f7fbff,
    #8fd8ff,
    #4f7cff,
    #3a1cff
  );
  box-shadow:
    0 0 10px rgba(140,210,255,.55),
    0 0 18px rgba(100,160,255,.35);
}

/* flow DÉSACTIVÉ par défaut */
#overdriveBarInner::after{
  content:"";
  position:absolute;
  inset:-30%;
  opacity:0;
}

/* flow UNIQUEMENT en overdrive */
body.overdriveActive #overdriveBarInner::after{
  opacity:.32;
  background:
    repeating-linear-gradient(
      180deg,
      rgba(255,255,255,.28) 0px,
      rgba(255,255,255,.28) 2px,
      rgba(255,255,255,0) 8px,
      rgba(255,255,255,0) 18px
    );
  animation:overdriveFlow 2.2s linear infinite;
}

@keyframes overdriveFlow{
  from{ transform:translateY(0); }
  to{ transform:translateY(32%); }
}

body.overdriveActive #overdriveBarInner{
  animation:overdrivePulse 1.4s ease-in-out infinite alternate;
}

@keyframes overdrivePulse{
  from{ opacity:.92; }
  to{ opacity:1; }
}

/* =========================
   COMBO (MOBILE SAFE)
========================== */
#combo{
  position:absolute;
  right:58px;
  top:50%;
  transform:translateY(-50%);
  font-size:14px;
  font-weight:900;
  letter-spacing:1px;
  opacity:0;
  color:#ffffff;
  text-shadow:0 0 4px rgba(120,200,255,.45);
  transition:opacity .2s ease;
}

body.comboActive #combo{
  opacity:.9;
}

/* =========================
   OVERDRIVE GLOBAL (LIGHT)
========================== */
body.overdriveActive #gameContainer{
  box-shadow:
    0 0 18px rgba(120,220,255,.28),
    0 0 36px rgba(80,160,255,.22);
}

body.overdriveActive #uiScore{
  text-shadow:
    0 0 10px rgba(160,240,255,.65),
    0 0 22px rgba(80,160,255,.35);
}

/* =========================
   FIN D’OVERDRIVE (COURT)
========================== */
@keyframes overdriveBlink{
  0%{ opacity:1 }
  50%{ opacity:.88 }
  100%{ opacity:1 }
}

body.overdriveEnding #gameContainer{
  animation: overdriveBlink .5s ease-in-out infinite;
}


/* =========================
   HINT
========================== */
#hint{
  position:absolute;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  font-size:13px;
  opacity:.6;
  text-shadow:0 0 6px #000;
  z-index:3;
  animation: hintFade 4s ease forwards;
}

@keyframes hintFade{
  0%{ opacity:.6 }
  70%{ opacity:.6 }
  100%{ opacity:0 }
}


/* =========================
   MENU — IMAGE FULLSCREEN + FX
========================== */

#menuOverlay{
  position:absolute;
  inset:0;
  z-index:9999;
  display:flex;
  pointer-events:auto;
  overflow:hidden;

  background: url("./assets/MJmenu.png") center / cover no-repeat;
}


/* ===== IMAGE FULLSCREEN ===== */
#menuOverlay #menuBg{
  position:absolute;
  inset:0;
  z-index:1;
}

#menuOverlay #menuBg img{
  width:100%;
  height:100%;
  object-fit:cover;
}
/* =========================
   VIGNETTE BAS (FOCUS BOUTONS)
========================== */
#menuOverlay{
  box-shadow: inset 0 -160px 180px rgba(0,0,0,.6);
}

 /* =========================
   BUTTON STACK — DESIGN ADAPTÉ À L’IMAGE MJ (LUNAIRE / DOUX)
   ⚠️ PLACEMENT STRICTEMENT IDENTIQUE
========================== */
#menuButtons{
  position:absolute;
  left:50%;
  top:65%;
  transform:translate(-50%, -50%);
  display:flex;
  flex-direction:column;
  gap:18px;
  z-index:10;
}

/* =========================
   BOUTONS — STYLE LUNAIRE / COTON / GALAXIE
========================== */
.menuBtn{
  min-width:250px;
  padding:16px 0;

  border:none;
  border-radius:999px;

  font-size:17px;
  font-weight:800;
  letter-spacing:2px;
  text-transform:uppercase;

  color:#0b1b2a;

  background:
    radial-gradient(circle at 30% 20%,
      rgba(255,255,255,.9),
      rgba(180,220,255,.85) 35%,
      rgba(120,180,255,.9) 65%,
      rgba(90,140,255,1)
    );

  cursor:pointer;
  position:relative;
  overflow:hidden;

  box-shadow:
    0 18px 40px rgba(0,0,0,.35),
    inset 0 2px 0 rgba(255,255,255,.7),
    inset 0 -6px 14px rgba(60,90,160,.35),
    0 0 0 1px rgba(255,255,255,.25);

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    filter .2s ease;
}

/* =========================
   HALO DOUX (ÉNERGIE LUNAIRE)
========================== */
.menuBtn::after{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:999px;
  background:
    radial-gradient(circle at 50% 50%,
      rgba(200,230,255,.55),
      rgba(200,230,255,0) 70%
    );
  opacity:.8;
  pointer-events:none;
}

/* =========================
   BRILLANCE SUBTILE
========================== */
.menuBtn::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      120deg,
      transparent 30%,
      rgba(255,255,255,.6) 50%,
      transparent 70%
    );
  opacity:.35;
  transform:translateX(-120%);
  transition:transform .9s ease;
  pointer-events:none;
}

/* =========================
   HOVER — FLOTTANT / DOUX
========================== */
.menuBtn:hover{
  transform:scale(1.05);
  filter:saturate(1.08) brightness(1.05);
  box-shadow:
    0 26px 60px rgba(0,0,0,.45),
    inset 0 2px 0 rgba(255,255,255,.85),
    inset 0 -8px 18px rgba(60,90,160,.45),
    0 0 46px rgba(160,210,255,.85);
}

.menuBtn:hover::before{
  transform:translateX(120%);
}

/* =========================
   ACTIVE — PRESSION DOUCE
========================== */
.menuBtn:active{
  transform:scale(0.96);
  box-shadow:
    0 10px 26px rgba(0,0,0,.45),
    inset 0 4px 10px rgba(60,90,160,.45);
}


/* =========================
   SHOP UI — AAA (VERSION PROPRE + BACK BTN)
========================== */

/* PANEL */
#shopPanel{
  position:absolute;
  inset:0;
  padding:96px 28px 28px;
  opacity:0;
  pointer-events:none;
  transform:translateX(46px);
  transition:opacity .25s ease, transform .25s ease;
  overflow-y:auto;
  z-index:10;

  background:linear-gradient(180deg, rgba(5,10,25,.72), rgba(5,6,10,.42));
  backdrop-filter: blur(16px) saturate(1.18);
}
#shopPanel.visible{
  opacity:1;
  pointer-events:auto;
  transform:translateX(0);
}

/* scroll */
#shopPanel::-webkit-scrollbar{width:10px}
#shopPanel::-webkit-scrollbar-track{background:rgba(0,0,0,.22); border-radius:999px}
#shopPanel::-webkit-scrollbar-thumb{background:rgba(120,200,255,.28); border-radius:999px}
#shopPanel::-webkit-scrollbar-thumb:hover{background:rgba(120,200,255,.38)}

/* =========================
   BACK BTN (TO MENU) — FIX
========================== */
#shopBackBtn{
  position:absolute;
  top:18px;
  left:18px;
  width:54px;
  height:54px;
  border-radius:50%;
  background:
    radial-gradient(circle at 30% 30%,
      rgba(255,255,255,.75),
      rgba(140,200,255,.55) 40%,
      rgba(30,60,130,.95)
    );
  border:1px solid rgba(255,255,255,.18);

  display:flex;              /* ✅ IMPORTANT */
  align-items:center;
  justify-content:center;

  font-size:26px;
  color:#eaf6ff;
  cursor:pointer;
  z-index:20;

  box-shadow:
    0 0 0 1px rgba(255,255,255,.18) inset,
    0 0 34px rgba(140,210,255,.55),
    0 0 90px rgba(90,150,255,.35);

  backdrop-filter:blur(14px) saturate(1.2);
  transition:transform .16s ease, filter .16s ease, box-shadow .16s ease;
}
#shopBackBtn:hover{
  transform:scale(1.12);
  filter:brightness(1.06);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.25) inset,
    0 0 48px rgba(180,240,255,.75),
    0 0 120px rgba(120,180,255,.55);
}
#shopBackBtn:active{
  transform:scale(.96);
}

/* =========================
   CATEGORY
========================== */
.shopCategory{ margin-bottom:32px; }
.shopCategoryTitle{
  font-size:14px;
  letter-spacing:4px;
  text-transform:uppercase;
  margin:18px 0 14px;
  text-shadow:0 0 14px rgba(0,0,0,.55);
}
.shopCategoryTitle.common{color:#c4d7e2;}
.shopCategoryTitle.rare{color:#a8ddff;}
.shopCategoryTitle.epic{color:#e8c2ff;}
.shopCategoryTitle.legendary{color:#ffe2b6;}

/* GRID */
.skinList{
  display:flex;
  flex-wrap:wrap;
  gap:16px;
}

/* =========================
   CARD — AAA COMPACT (comme avant mais mieux)
========================== */
.skinCard{
  flex:0 0 176px;
  padding:14px 14px 16px;
  border-radius:22px;
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(circle at 50% 0%,
      rgba(160,220,255,.18),
      rgba(10,16,34,.86) 60%
    );

  border:1px solid rgba(255,255,255,.16);

  box-shadow:
    0 0 0 1px rgba(255,255,255,.06) inset,
    0 18px 46px rgba(0,0,0,.70),
    0 0 60px rgba(120,190,255,.18);

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;

  transition:transform .22s ease, box-shadow .22s ease, filter .22s ease;
}
.skinCard::after{
  content:"";
  position:absolute;
  inset:-50%;
  background:
    radial-gradient(circle at 30% 20%,
      rgba(220,245,255,.25),
      rgba(0,0,0,0) 60%
    );
  transform:rotate(18deg);
  opacity:.85;
  pointer-events:none;
}
.skinCard:hover{
  transform:translateY(-4px) scale(1.03);
  filter:brightness(1.04) saturate(1.06);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.10) inset,
    0 28px 70px rgba(0,0,0,.85),
    0 0 110px rgba(140,210,255,.45);
}

/* rarity */
.skinCard.epic{ border-color:rgba(200,120,255,.35); box-shadow:0 0 120px rgba(200,120,255,.35); }
.skinCard.legendary{ border-color:rgba(255,200,120,.35); box-shadow:0 0 140px rgba(255,200,120,.40); }

/* preview */
.skinPreview{
  width:94px;
  height:94px;
  border-radius:20px;
  background:
    radial-gradient(circle at 30% 25%,
      rgba(255,255,255,.8),
      rgba(140,200,255,.55) 40%,
      rgba(0,0,0,.95)
    );
  border:1px solid rgba(255,255,255,.22);
  box-shadow:
    0 0 28px rgba(160,230,255,.55),
    0 0 90px rgba(100,160,255,.25);
}

/* text */
.skinName{ font-size:15px; font-weight:900; letter-spacing:.7px; text-shadow:0 0 14px rgba(0,0,0,.7); }
.skinPrice{ font-size:12px; opacity:.9; }

/* button */
.skinButton{
  margin-top:8px;
  padding:10px 20px;
  border-radius:999px;
  border:none;
  font-size:12px;
  font-weight:900;
  letter-spacing:1.2px;
  cursor:pointer;
  transition:transform .14s ease, box-shadow .14s ease, filter .14s ease;
}
.skinButton.common{ background:linear-gradient(180deg,#cfe5f1,#6f9fb4); color:#071018; box-shadow:0 0 22px rgba(140,200,255,.35); }
.skinButton.rare{ background:linear-gradient(180deg,#c0f2ff,#4fb3ff); color:#04121f; box-shadow:0 0 32px rgba(140,220,255,.55); }
.skinButton.epic{ background:linear-gradient(180deg,#f2cfff,#a15cff); color:#22002f; box-shadow:0 0 36px rgba(200,120,255,.65); }
.skinButton.legendary{ background:linear-gradient(180deg,#ffefc8,#ffb24a); color:#2a1400; box-shadow:0 0 42px rgba(255,200,120,.75); }

.skinButton:not(.disabled):hover{
  transform:scale(1.08);
  filter:saturate(1.12) brightness(1.06);
}
.skinButton.disabled{
  opacity:.55;
  filter:grayscale(.7);
  cursor:default;
  box-shadow:none;
}

.skinEquippedTag{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.8px;
  color:#baffea;
  text-shadow:0 0 16px rgba(0,0,0,.75);
}

/* keep */
.bigButton{
  background:linear-gradient(135deg,#9fe8ff,#4fb3ff)!important;
  box-shadow:0 0 34px rgba(140,220,255,.85)!important;
  color:#04121f!important;
}

/* =========================
   INTRO — FULLSCREEN IMAGE + FX OVERLAY
========================== */

#overlayIntro{
  position:absolute;
  inset:0;
  z-index:100000;
  overflow:hidden;
  pointer-events:auto;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#000;
}


/* ===== LOGO INTRO — FULLSCREEN DÉZOOMÉ ===== */
#overlayIntro #introLogo{
  position:absolute;
  inset:0;
  z-index:5;
  display:flex;
  align-items:center;
  justify-content:center;
}

#overlayIntro #introLogo img{
  width:100vw;
  height:100vh;

  object-fit:contain;     /* ← CLÉ DU DÉZOOM */
  object-position:center;

  background:#000;        /* bandes propres si ratio différent */

  filter:
    drop-shadow(0 0 12px rgba(0,0,0,.6));
}


/* =========================
   MENU STATS — DEEP SPACE CAPSULE (PRO)
   mêmes IDs / classes
========================== */

#menuStats{
  position:absolute;
  top:58%;
  left:14.5%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:32px;
  z-index:12;
  pointer-events:none;
}

/* =========================
   CAPSULE CORE
========================== */
#menuStats .statBox{
  position:relative;
  width:132px;
  height:88px;
  border-radius:18px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(180deg,
      rgba(30,50,110,.65),
      rgba(10,16,38,.92)
    );

  border:1px solid rgba(120,170,255,.35);
  backdrop-filter: blur(10px) saturate(1.15);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    inset 0 -10px 18px rgba(0,0,0,.6),
    0 14px 36px rgba(0,0,0,.6),
    0 0 36px rgba(120,170,255,.35);

  animation: capsuleFloat 8s ease-in-out infinite;
  overflow:hidden;
}

/* =========================
   SUBTLE EDGE GLOW
========================== */
#menuStats .statBox::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:18px;
  box-shadow:
    inset 0 0 0 1px rgba(160,200,255,.22),
    inset 0 0 22px rgba(120,180,255,.18);
  pointer-events:none;
}

/* =========================
   MICRO SHEEN
========================== */
#menuStats .statBox::after{
  content:"";
  position:absolute;
  inset:-60%;
  background:
    linear-gradient(
      120deg,
      transparent 46%,
      rgba(200,220,255,.22),
      transparent 54%
    );
  opacity:.25;
  animation: microSheen 7s linear infinite;
  pointer-events:none;
}

/* =========================
   TYPO — CLEAN / READABLE
========================== */
#menuStats .statLabel{
  font-size:9px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#cfe4ff;
  opacity:.75;
}

#menuStats .statValue{
  margin-top:6px;
  font-size:22px;
  font-weight:800;
  color:#f2f6ff;
  text-shadow:0 0 12px rgba(120,180,255,.55);
}

/* =========================
   COINS — MUTED GOLD (NO BLING)
========================== */
#menuStats .statBox.coins{
  background:
    linear-gradient(180deg,
      rgba(90,70,30,.7),
      rgba(26,18,8,.95)
    );

  border:1px solid rgba(220,190,120,.45);

  box-shadow:
    inset 0 1px 0 rgba(255,240,190,.12),
    inset 0 -10px 18px rgba(0,0,0,.65),
    0 14px 36px rgba(0,0,0,.65),
    0 0 32px rgba(255,200,120,.35);
}

#menuStats .statBox.coins .statValue{
  color:#ffe7a8;
  text-shadow:0 0 14px rgba(255,210,120,.65);
}

#menuStats .statBox.coins::after{
  background:
    linear-gradient(
      120deg,
      transparent 48%,
      rgba(255,245,200,.45),
      transparent 52%
    );
  opacity:.35;
  animation: goldSheen 4.2s ease-in-out infinite;
}

/* =========================
   ANIMATIONS — SOBER
========================== */
@keyframes capsuleFloat{
  0%,100%{ transform:translateY(0) }
  50%{ transform:translateY(-6px) }
}

@keyframes microSheen{
  from{ transform:translateX(-50%) }
  to{ transform:translateX(50%) }
}

@keyframes goldSheen{
  0%{ transform:translateX(-60%) }
  50%{ transform:translateX(60%) }
  100%{ transform:translateX(-60%) }
}



#shopStats{
  position:absolute;
  top:20px;
  left:100px;
  display:flex;
  gap:16px;
  z-index:30;
}

#shopStats .statBox{
  padding:14px 18px;
  min-width:150px;
  border-radius:20px;
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,.18), transparent 55%),
    linear-gradient(180deg, rgba(20,36,72,.88), rgba(6,10,26,.96));
  border:1px solid rgba(180,220,255,.25);
  backdrop-filter: blur(18px);
  box-shadow:
    0 20px 40px rgba(0,0,0,.55),
    0 0 50px rgba(120,180,255,.22);
}

#shopStats .statLabel{
  font-size:10px;
  letter-spacing:3px;
  opacity:.75;
  color:#d6f0ff;

/* ============================
   AUDIO MANAGER (STABLE)
   - 1 seule source de vérité
   - mute = pause + reset (pas de "blip")
   - replay = volume restauré avant play()
============================ */
let gameMusicStopTimer = null;

const musicMenu = document.getElementById("musicMenu");
const musicGame = document.getElementById("musicGame");
const sfxDeath  = document.getElementById("sfxDeath");

const audioSettings = JSON.parse(localStorage.getItem("audioSettings") || "null")
  || { music:70, sfx:80, mute:false };

let audioUnlocked = false; // requis par les navigateurs (gesture)
let currentMusic = "none"; // "menu" | "game" | "none"

function clamp01(v){ return Math.max(0, Math.min(1, v)); }

function applyAudioSettings(){
  const m = audioSettings.mute ? 0 : clamp01(audioSettings.music / 100);
  const s = audioSettings.mute ? 0 : clamp01(audioSettings.sfx / 100);

  if (musicMenu) musicMenu.volume = m * 0.9;
  if (musicGame) musicGame.volume = m;
  if (sfxDeath)  sfxDeath.volume  = s;
}

function stopMusic(track){
  if (!track) return;
  try { track.pause(); } catch(e){}
  try { track.currentTime = 0; } catch(e){}
}

function playMusic(which){
  // which: "menu" | "game" | "none"
  if (!audioUnlocked) { currentMusic = which; return; }

  // mute = tout couper, pas de résidu
  if (audioSettings.mute) {
    stopMusic(musicMenu);
    stopMusic(musicGame);
    currentMusic = "none";
    return;
  }

  applyAudioSettings();

  if (which === "menu") {
    if (musicGame) stopMusic(musicGame);
    if (musicMenu) {
      musicMenu.loop = true;
      // ⚠️ IMPORTANT: remettre un volume audible AVANT play (sinon replay = silence)
      musicMenu.volume = clamp01(audioSettings.music/100) * 0.9;
      musicMenu.play().catch(()=>{});
    }
    currentMusic = "menu";
    return;
  }

  if (which === "game") {
    if (musicMenu) stopMusic(musicMenu);
    if (musicGame) {
      musicGame.loop = true;
      musicGame.volume = clamp01(audioSettings.music/100);
      musicGame.play().catch(()=>{});
    }
    currentMusic = "game";
    return;
  }

  // none
  stopMusic(musicMenu);
  stopMusic(musicGame);
  currentMusic = "none";
}

function fadeAudio(audio, targetVolume, duration = 260) {
  // Gardé pour l'effet "cinéma" MAIS respecte mute
  if (!audio || audioSettings.mute) return;
  const start = audio.volume;
  const delta = targetVolume - start;
  const startTime = performance.now();
  function step(now) {
    const t = Math.min(1, (now - startTime) / duration);
    audio.volume = start + delta * t;
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function randomRange(a,b){ return a + Math.random()*(b-a); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function farRightX(){
  let mx=-1e9;
  for(const ob of obstacles){
    if(ob.kind==='rotbar'){ mx=Math.max(mx, ob.cx+ob.len+60); }
    else if(ob.kind==='circle'){ mx=Math.max(mx, ob.x+ob.r+60); }
    else { mx=Math.max(mx, (ob.x||0)+(ob.width||0)+60); }
  }
  return mx;
}

// SAT AABB vs OBB
function aabbVsOBB(ax,ay,aw,ah, cx,cy, halfW, halfH, angle){
  const c=Math.cos(angle), s=Math.sin(angle);
  const dax=(ax+aw/2)-cx, day=(ay+ah/2)-cy;
  const lx =  dax*c + day*s;
  const ly = -dax*s + day*c;
  const ex = Math.abs(aw/2 * c) + Math.abs(ah/2 * s);
  const ey = Math.abs(aw/2 * s) + Math.abs(ah/2 * c);
  const skin=1.5;
  return (Math.abs(lx) <= (halfW - skin) + ex) && (Math.abs(ly) <= (halfH - skin) + ey);
}

function turretParams(ph){
  if(ph===1) return {fireMs:1600, bullet:4.2, preAim:700, reposition:2600, spread:40};
  if(ph===2) return {fireMs:1350, bullet:4.8, preAim:650, reposition:2200, spread:55};

function canPlaceTurret(){
  const limit = WIDTH+280;
  for(const ob of obstacles){
    const right = (ob.kind==='rotbar') ? ob.cx+ob.len :
      (ob.kind==='circle' ? ob.x+ob.r : (ob.x||0)+(ob.width||0));
    if(right>WIDTH && right<limit){
      if(ob.kind==='movingRect' || ob.kind==='sweeper' || ob.kind==='rotbar') return false;
    }
  }
  return true;
}
function spawnTurret(ph){
  if(ph === 0) return;

// dispatcher
function spawn(){
  const now = performance.now();
  const ph  = phase(score);

  const minGap = 90 - ph * 8;
  const overlapTolerance = Math.max(
    140,
    420 - ph * 70
  );

  if (farRightX() > WIDTH + minGap) {
    if (now - lastSpawnTime < overlapTolerance) return;
  }

  const freq = FREQ[ph];
  const entries = Object.entries(freq);

  let r = Math.random(), sum = 0;
  for (const [,p] of entries) sum += p;

  let pick = null, acc = 0;
  for (const [name,p] of entries){
    acc += p;
    if (r * sum <= acc) { pick = name; break; }
  }

  if (pick === lastType && Math.random() < 0.6) pick = 'gap';
  lastType = pick;

  const intensity = OBSTACLE_WEIGHT[pick] || 0;

  if (typeof lastIntensity !== "undefined") {
    if (lastIntensity >= 2 && intensity >= 2) {
      pick = 'gap';
    }
    if ((intensity - lastIntensity) >= 2 && Math.random() < 0.6) {
      pick = 'circle';
    }
  }
  lastIntensity = intensity;

  // ===== SÉCURITÉ ROTBAR =====
  if (pick === 'rotbar') {
    for (const ob of obstacles) {
      const bad =
        ob.kind === 'rect' ||
        ob.kind === 'movingRect' ||
        ob.kind === 'sweeper' ||
        ob.kind === 'turret';

      if (!bad) continue;

      const right = (ob.x ?? 0) + (ob.width ?? 0);
      if (right > WIDTH - 220 && right < WIDTH + 560) {
        rotbarNoSpawnUntil = now + 900;
        return;
      }
    }
  }

  if (pick === 'gap' || pick === 'mover' || pick === 'sweeper') {
    for (const ob of obstacles) {
      if (ob.kind !== 'rotbar') continue;

      const left  = ob.cx - ob.len;
      const right = ob.cx + ob.len;

      if (right > WIDTH - 160 && left < WIDTH + 520) {
        return;
      }
    }
  }

  lastSpawnTime = now;

  switch(pick){
    case 'gap':     return spawnGap(ph);
    case 'circle':  return spawnCircle(ph);
    case 'mover':   return spawnMover(ph);
    case 'rotbar':  return spawnRotbar(ph);
    case 'sweeper': return spawnSweeper(ph);
    case 'turret':  return spawnTurret(ph);
    default:        return spawnGap(ph);
  }
}

      p.glow = 6;
      break;
    case "voidwalker":
      p.shape = "void";
      p.color = "rgba(140,110,220,1)";
      p.glow = 14;
      break;
  }

  if (playerParticles.length < PARTICLE_POOL_SIZE){
    playerParticles.push(p);
  }
}

/* =========================
   UTILS
========================= */
function aabbVsRect(ax,ay,aw,ah, bx,by,bw,bh){
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}
function isOptionsOpen(){
  return optionsPanelEl && optionsPanelEl.style.display === "flex";
}

/* =========================
   UPDATE
========================= */
function update(delta, ts){
  updateFXCalm(delta);
  trackFPS(delta);

  const target = jetOn ? 1 : 0;
  moonyExpr += (target - moonyExpr) * 0.08;

  if (isOptionsOpen()){
    jetOn = false;
    player.vy = 0;
    return;
  }

  if (gameState === "dying"){
    for (const p of particles){
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.02;
      p.age += delta;
    }
    particles = particles.filter(p => p.age < p.life);

    if (shockwave){
      shockwave.r += 6;
      shockwave.alpha *= 0.95;
      if (shockwave.r > (shockwave.max || 180) || shockwave.alpha < 0.02) shockwave = null;
    }
    if (bloom){
      bloom.a *= 0.92;
      if (bloom.a < 0.02) bloom = null;
    }
    if (dyingFromCircle){
      const cx = dyingFromCircle.x, cy = dyingFromCircle.y;
      const pcx = player.x + player.width/2;
      const pcy = player.y + player.height/2;
      player.x += (cx - pcx) * 0.06;
      player.y += (cy - pcy) * 0.06;
      player.width  *= 0.992;
      player.height *= 0.992;
    }
    shake *= 0.93;
    dyingTimer -= delta;
    if (dyingTimer <= 0) handleGameOver();
    return;
  }

  if (gameState !== "playing") return;

  const ph = phase(score);

  if (overdriveActive){
    overdriveTimer -= Math.min(delta, 18);
    const pct = Math.max(0, overdriveTimer / overdriveDuration);
    const pctInt = (pct * 100) | 0;
    if (pctInt !== lastOverdrivePct){
      lastOverdrivePct = pctInt;
      safeStyle(UI.overFill, "height", pctInt + "%");
    }
    if (pct < 0.35) document.body.classList.add("overdriveEnding");
    if (overdriveTimer <= 0) deactivateOverdrive();
  }

  player.vy += (jetOn ? THRUST : GRAVITY);
  player.vy = Math.max(Math.min(player.vy, 8), -8);
  player.y += player.vy;

  if (player.y < 0){ player.y = 0; player.vy = 0; }
  if (player.y + player.height > HEIGHT){
    player.y = HEIGHT - player.height;
    player.vy = 0;
  }

  const TRAIL_INTERVAL = 40;
  if (
    (jetOn || Math.abs(player.vy) > 0.25) &&
    performance.now() - lastTrailSpawn > TRAIL_INTERVAL
  ){
    spawnPlayerTrail(
      player.x + player.width * 0.5,
      player.y + player.height * 0.65,
      currentSkin || "moony"
    );
    lastTrailSpawn = performance.now();
  }

  const sp = obstacleSpeed;
  bgScroll += 0.6;

  if (ts - lastSpawn > currentSpawnInterval(score)){
    spawn();
    lastSpawn = ts;
  }

  obstacles.forEach(ob=>{
    if (ob.kind === "rotbar"){
      ob.cx -= sp;
      ob.angle += ob.speed;
    } else if (ob.kind !== "turret"){
      ob.x -= sp;
    }
    if (ob.kind === "movingRect"){
      ob.t += ob.speed * 0.05;
      const range = ob.amp || movingAmplitude(score);
      if (ob.baseY === 0){
        ob.y = clamp(Math.sin(ob.t) * range, 0, HEIGHT - ob.height);
      } else {
        ob.y = clamp(ob.baseY - Math.sin(ob.t) * range, 0, HEIGHT - ob.height);
      }
    }
  });

  obstacles.forEach(ob=>{
    if (ob.kind !== "turret") return;
    ob.x -= sp;
    ob.t += delta;
    ob.reTimer -= delta;
    if (ob.reTimer <= 0){
      ob.reTimer = ob.reBase;
      ob.y = clamp(
        player.y + randomRange(-ob.spread, ob.spread),
        60, HEIGHT - 60
      );
    }
    ob.next -= delta;
    if (ob.next <= 0){
      ob.next = ob.fireMs;
      if (ob.safeFirst){ ob.safeFirst = false; return; }
      spawnBullet(ob.x, ob.y, ob.bulletSpeed);
    }
  });

  obstacles = obstacles.filter(ob=>{
    if (ob.kind === "rotbar") return (ob.cx + ob.len) > -80;
    if (ob.kind === "circle") return ob.x + ob.r > -40;
    if (ob.kind === "tilted") return (ob.x + Math.abs(ob.len*Math.cos(ob.angle)) + 60) > -40;
    return (ob.x + (ob.width || 0)) > -40;
  });

  const extraSpeed = overdriveActive ? 1 : 0;
  bullets.forEach(b => b.x += b.vx - extraSpeed);
  bullets = bullets.filter(b => b.x + b.r > -40);

  coins.forEach(c => c.x -= sp);
  coins = coins.filter(c => c.x + c.r > -40);

  if (!overdriveActive){
    const rx = player.x, ry = player.y, rw = player.width, rh = player.height;
    const cxp = rx + rw/2, cyp = ry + rh/2;

    for (const ob of obstacles){
      if (ob.kind === "rect" || ob.kind === "movingRect" || ob.kind === "sweeper"){
        if (aabbVsRect(rx,ry,rw,rh, ob.x,ob.y,ob.width,ob.height)){
          startDeath(false,null,"rect"); return;
        }
      } else if (ob.kind === "circle"){
        const dx = cxp - ob.x, dy = cyp - ob.y;
        const rr = (ob.r * 0.9) + (ob.pulse || 0);
        if (dx*dx + dy*dy < rr*rr){
          startDeath(true,ob,"circle"); return;
        }
      } else if (ob.kind === "rotbar"){
        if (aabbVsOBB(rx,ry,rw,rh, ob.cx,ob.cy, ob.half||7, ob.len, ob.angle)){
          startDeath(false,null,"bar"); return;
        }
      } else if (ob.kind === "turret"){
        if (aabbVsRect(rx,ry,rw,rh, ob.x-2,ob.y-2, ob.w+4,ob.h+4)){
          startDeath(false,null,"turret"); return;
        }
      } else if (ob.kind === "tilted"){
        if (aabbVsOBB(rx,ry,rw,rh, ob.x,ob.y, (ob.width||34)/2, ob.len/2, ob.angle)){
          startDeath(false,null,"tilted"); return;
        }
      }
    }

    for (const b of bullets){
      const cx = clamp(b.x, rx, rx+rw);
      const cy = clamp(b.y, ry, ry+rh);
      const dx = b.x - cx, dy = b.y - cy;
      if (dx*dx + dy*dy <= b.r*b.r){
        startDeath(false,null,"bullet"); return;
      }
    }
  }

  for (let i = coins.length-1; i >= 0; i--){
    const c = coins[i];
    const cx = clamp(c.x, player.x, player.x+player.width);
    const cy = clamp(c.y, player.y, player.y+player.height);
    const dx = c.x - cx, dy = c.y - cy;

    if (dx*dx + dy*dy <= c.r*c.r){
      coins.splice(i,1);
      coinsCollected++;
      const now = performance.now();
      combo = (now-lastCoinTime < 1600) ? combo+1 : 1;
      lastCoinTime = now;
      if (UI.combo) UI.combo.textContent = combo;
      if (UI.coins) UI.coins.textContent = coinsCollected;
      addOverdrive(1);
      const base = overdriveActive ? 400 : 200;
      score += base + Math.floor(base * 0.1 * Math.max(0, combo-1));
    }
  }

  score += delta * 0.24 * paceMultiplier(score) * (overdriveActive ? 2 : 1);
  if (UI.score) UI.score.textContent = Math.floor(score).toLocaleString();

  obstacleSpeed = 3.8 + Math.pow(score/8000,0.9) + [0,0.55,1.05,1.55,2][ph];
}

/* ===== GLOBAL PLAYER PARTICLES ===== */
let lastJetSpawn = 0;
let fxTime = 0;

// ====== MINI CACHE POUR SOLAR (ANTI LAG) ======
const solarGradCache = new Map(); // key -> CanvasGradient

function getSolarGradient(ctx, rr, lifeRatio){
  // rr varie beaucoup → on quantize pour réutiliser des gradients proches (visuel identique)
  const q = Math.max(2, Math.round(rr * 2)); // pas trop fin
  const key = q + "|" + (lifeRatio > 0.6 ? 1 : lifeRatio > 0.3 ? 2 : 3);

  let g = solarGradCache.get(key);
  if (g) return g;

  const R = q / 2;
  // gradient centré en (0,0) puis on translate avant (moins d’allocations)
  g = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 3.2);

  // on garde tes intensités (même rendu)
  const a1 = 0.55 * (lifeRatio > 0.6 ? 1 : lifeRatio > 0.3 ? 0.75 : 0.55);
  const a2 = 0.45 * (lifeRatio > 0.6 ? 1 : lifeRatio > 0.3 ? 0.75 : 0.55);
  const a3 = 0.22 * (lifeRatio > 0.6 ? 1 : lifeRatio > 0.3 ? 0.75 : 0.55);

  g.addColorStop(0.0, `rgba(255,255,220,${a1})`);
  g.addColorStop(0.25, `rgba(255,210,90,${a2})`);
  g.addColorStop(0.55, `rgba(255,140,40,${a3})`);
  g.addColorStop(1.0, "rgba(255,120,20,0)");

  // limite taille cache (évite fuite mémoire)
  if (solarGradCache.size > 36) solarGradCache.clear();

  solarGradCache.set(key, g);
  return g;
}

/* =========================
   DRAW PLAYER PARTICLES (POOL VERSION)
   ➜ remplace ta fonction drawPlayerParticles entière
========================== */
function drawPlayerParticles(ctx){
  // iterate FIXE sur la liste (petite) + on désactive dans le pool
  for (let i = playerParticles.length - 1; i >= 0; i--){
    const p = playerParticles[i];

    // skip si inactif
    if (!p.active){
      playerParticles.splice(i,1);
      continue;
    }

    // advance
    p.x += p.vx;
    p.y += p.vy;
    p.life--;

    if (p.life <= 0){
      p.active = false;
      playerParticles.splice(i,1);
      continue;
    }

    const lifeRatio = p.life / p.lifeMax;
    if (lifeRatio <= 0.02){
      p.active = false;
      playerParticles.splice(i,1);
      continue;
    }

    ctx.save();
    ctx.globalAlpha = lifeRatio;

    // shadow only si fps ok
    if (p.glow > 0 && fps > 48){
      ctx.shadowColor = p.color;
      ctx.shadowBlur = p.glow * fxCalm;
    } else {
      ctx.shadowBlur = 0;
    }

    switch (p.shape){

      default: // moony
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(
          p.x,
          p.y + Math.sin(p.life * 0.3) * 0.6,
          p.size * (0.8 + lifeRatio * 0.6),
          0, Math.PI*2
        );
        ctx.fill();
        break;

      case "leaf":
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.ellipse(
          p.x + Math.sin(p.life * 0.4) * 1.2,
          p.y + Math.cos(p.life * 0.3) * 1.2,
          p.size * 1.1,
          p.size * 0.6,
          p.life * 0.15,
          0, Math.PI*2
        );
        ctx.fill();
        break;

      case "solar":
        ctx.globalCompositeOperation = "lighter";

        const flick = 0.75 + 0.25 * Math.sin(fxTime * 7 + p.seed * 3.1);
        const rr = p.size * (0.9 + lifeRatio * 0.9);

        ctx.save();
        ctx.translate(p.x, p.y);

        const g = getSolarGradient(ctx, rr, lifeRatio);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, 0, rr * 3.1, 0, Math.PI*2);
        ctx.fill();

        ctx.globalAlpha *= flick;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(
          Math.sin(fxTime * 5 + p.seed) * 0.6,
          Math.cos(fxTime * 4.3 + p.seed) * 0.6,
          rr,
          0, Math.PI*2
        );
        ctx.fill();

        ctx.strokeStyle = "rgba(255,245,200,0.85)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(
          -p.vx * (2.6 + (1 - lifeRatio) * 1.8),
          -p.vy * (2.6 + (1 - lifeRatio) * 1.8)
        );
        ctx.stroke();

        ctx.restore();

        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = lifeRatio;
        break;

      case "snow":
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 1;
        const s = p.size * 1.4 * lifeRatio;
        ctx.beginPath();
        ctx.moveTo(p.x - s, p.y);
        ctx.lineTo(p.x + s, p.y);
        ctx.moveTo(p.x, p.y - s);
        ctx.lineTo(p.x, p.y + s);
        ctx.stroke();
        break;

      case "ember":
        if (p.jx == null){
          p.jx = (Math.random() - 0.5) * 1.2;
          p.js = 0.5 + Math.random() * 0.6;
        }
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(
          p.x + p.jx,
          p.y - (1 - lifeRatio) * 2.2,
          p.size * p.js,
          0, Math.PI*2
        );
        ctx.fill();
        break;

      case "line":
        ctx.globalCompositeOperation = "lighter";
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 2.2, p.y - p.vy * 2.2);
        ctx.stroke();
        ctx.globalCompositeOperation = "source-over";
        break;

      case "void":
        ctx.globalCompositeOperation = "lighter";
        const pull = (1 - lifeRatio) * 2;

        ctx.fillStyle = "rgba(120,90,180,0.75)";
        ctx.beginPath();
        ctx.arc(
          p.x - pull,
          p.y + Math.sin(p.life * 0.4) * 0.6,
          p.size * (0.9 + lifeRatio),
          0, Math.PI*2
        );
        ctx.fill();

        ctx.fillStyle = "rgba(15,8,25,0.9)";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 0.45, 0, Math.PI*2);
        ctx.fill();

        ctx.globalCompositeOperation = "source-over";
        break;
    }

    ctx.restore();
  }
}

// ===== GLOBAL (une seule fois, au-dessus de drawMoonyFace) =====
let moonyBlink = 1;
let blinkPhase = 0;
let nextBlink  = 0;

// "normal" ou "nintendo"
let moonyBlinkMode = "nintendo";


function drawMoonyFace(ctx, hx, hy, r, vy){
  const t = fxTime;
  const focus = moonyExpr || 0;

  /* =========================
     POSITION GLOBALE
  ========================= */
  const eyeY      = hy - r * 0.18;
  const eyeOffset = r * 0.46;

  /* =========================
     BLINK (2 MODES)
  ========================= */
  if (moonyBlinkMode === "normal") {
    // blink simple + un peu plus fréquent
    moonyBlink =
      (Math.sin(t * 0.9 + Math.sin(t * 0.13) * 2) > 0.96) ? 0.18 : 1;
  } else {
    // blink Nintendo (double occasionnel)
    if (t > nextBlink && blinkPhase === 0) blinkPhase = 0.01;

    if (blinkPhase > 0) {
      blinkPhase += 0.18;                 // vitesse
      moonyBlink = Math.abs(Math.cos(blinkPhase)); // 1 → 0 → 1

      if (blinkPhase > Math.PI) {
        blinkPhase = 0;
        moonyBlink = 1;

        // double blink rare
        if (Math.random() < 0.18) nextBlink = t + 0.15;
        else nextBlink = t + 2.1 + Math.random() * 2.6;
      }
    }
  }

  /* =========================
     LUEUR LUNAIRE — AUTONOME
     (IMPORTANT: on "pose" une peau argentée,
      puis on ajoute halo + core, sinon sur du blanc
      ça peut paraître invisible)
  ========================= */
  const moonPulse = 0.75 + Math.sin(t * 1.1) * 0.25; // respiration lente
  const moonShine = 0.60 + Math.sin(t * 0.4) * 0.40; // variation large

  // PEAU ARGENTÉE (base visible)
  const moonSkin = ctx.createRadialGradient(
    hx, hy - r*0.25, r*0.12,
    hx, hy, r*1.35
  );
  moonSkin.addColorStop(0,   `rgb(${232 + moonPulse*18}, ${238 + moonPulse*12}, ${252})`);
  moonSkin.addColorStop(0.55,`rgb(${205 + moonShine*22}, ${215 + moonShine*16}, ${232 + moonShine*10})`);
  moonSkin.addColorStop(1,   `rgb(${175 + moonShine*10}, ${185 + moonShine*10}, ${205 + moonShine*8})`);

  ctx.fillStyle = moonSkin;
  ctx.beginPath();
  ctx.arc(hx, hy, r*1.03, 0, Math.PI*2);
  ctx.fill();

  // HALO LUNAIRE (autour)
  const moonGlow = ctx.createRadialGradient(
    hx, hy - r*0.25, r*0.15,
    hx, hy, r*1.65
  );
  moonGlow.addColorStop(0,    `rgba(255,255,255,${0.22 * moonPulse})`);
  moonGlow.addColorStop(0.45, `rgba(225,238,255,${0.18 * moonShine})`);
  moonGlow.addColorStop(1,    "rgba(255,255,255,0)");

  ctx.fillStyle = moonGlow;
  ctx.beginPath();
  ctx.arc(hx, hy, r*1.18, 0, Math.PI*2);
  ctx.fill();

  // CORE LUMINEUX (cœur)
  const moonCore = ctx.createRadialGradient(
    hx, hy - r*0.15, r*0.05,
    hx, hy, r*0.95
  );
  moonCore.addColorStop(0, `rgba(255,255,255,${0.22 + moonPulse*0.18})`);
  moonCore.addColorStop(1, "rgba(255,255,255,0)");

  ctx.fillStyle = moonCore;
  ctx.beginPath();
  ctx.arc(hx, hy, r*0.98, 0, Math.PI*2);
  ctx.fill();

  /* =========================
     YEUX — BÉBÉ MANGA
  ========================= */
  function moonyEye(x){
    ctx.save();
    ctx.translate(x, eyeY);

    const baseR = r * 0.34;
    const eyeR  = baseR * (0.98 + Math.sin(t*1.6)*0.025);

    ctx.scale(1, moonyBlink);

    // blanc
    ctx.fillStyle = "#fffefb";
    ctx.beginPath();
    ctx.arc(0, 0, eyeR, 0, Math.PI*2);
    ctx.fill();

    // iris large
    const iris = ctx.createRadialGradient(0,0,0,0,0,eyeR*0.9);
    iris.addColorStop(0, "#7a6646");
    iris.addColorStop(1, "#4a3a24");
    ctx.fillStyle = iris;
    ctx.beginPath();
    ctx.arc(0, 0, eyeR * 0.72, 0, Math.PI*2);
    ctx.fill();

    // pupille petite
    ctx.fillStyle = "#1b1611";
    ctx.beginPath();
    ctx.arc(
      Math.sin(t*0.6) * eyeR * (0.10 - focus*0.04),
      Math.cos(t*0.5) * eyeR * (0.10 - focus*0.04),
      eyeR * (0.20 - focus*0.08),
      0, Math.PI*2
    );
    ctx.fill();

    // reflets kawaii
    ctx.fillStyle = "rgba(255,255,255,0.98)";
    ctx.beginPath();
    ctx.arc(-eyeR*0.32, -eyeR*0.36, eyeR*0.30, 0, Math.PI*2);
    ctx.arc( eyeR*0.18, -eyeR*0.22, eyeR*0.12, 0, Math.PI*2);
    ctx.arc(-eyeR*0.05, -eyeR*0.05, eyeR*0.06, 0, Math.PI*2);
    ctx.fill();

    // glow doux
    const glow = ctx.createRadialGradient(0,0,eyeR*0.4,0,0,eyeR*1.25);
    glow.addColorStop(0, "rgba(255,255,255,0.12)");
    glow.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0,0,eyeR*1.2,0,Math.PI*2);
    ctx.fill();

    ctx.restore();
  }

  moonyEye(hx - eyeOffset);
  moonyEye(hx + eyeOffset);

  /* =========================
     BOUCHE — VIVANTE (RESPIRATION + TILT + micro "o")
  ========================= */
  const my = hy + r * 0.42;

  const breathe = Math.sin(t * 1.6) * r * 0.025;
  const mood    = focus ? -r*0.04 : r*0.02;
  const tilt    = Math.sin(t * 0.9) * r * 0.015;

  ctx.strokeStyle = "#6a5844";
  ctx.lineWidth   = r * 0.065;
  ctx.lineCap     = "round";

  ctx.beginPath();
  ctx.moveTo(hx - r*0.15, my);
  ctx.quadraticCurveTo(
    hx + tilt,
    my + r*0.18 + breathe + mood,
    hx + r*0.15,
    my
  );
  ctx.stroke();

  // micro "o" rare (kawaii)
  if (!focus && Math.sin(t * 0.6) > 0.92) {
    ctx.fillStyle = "#6a5844";
    ctx.beginPath();
    ctx.arc(hx, my + r*0.05, r*0.045, 0, Math.PI*2);
    ctx.fill();
  }

  /* =========================
     JOUES — KAWAII POWER
  ========================= */
  ctx.fillStyle = "rgba(255,180,170,0.45)";
  ctx.beginPath();
  ctx.arc(hx - r*0.42, hy + r*0.24, r*0.13, 0, Math.PI*2);
  ctx.arc(hx + r*0.42, hy + r*0.24, r*0.13, 0, Math.PI*2);
  ctx.fill();
}






function drawSolarFace(ctx, hx, hy, r, vy){
  const t = fxTime;

  /* =========================
     ÉNERGIE SOLAIRE VIVANTE
  ========================= */
  const sun = 0.6 + Math.sin(t * 0.7) * 0.4;

  /* =========================
     POSITION GLOBALE
  ========================= */
  const eyeY = hy - r * 0.22;
  const eyeOffset = r * 0.48;

  /* =========================
     BLINK — NATUREL
  ========================= */
  const blink =
    Math.sin(t * 1.6 + Math.sin(t * 0.25) * 2.5) > 0.92
      ? 0.14
      : 1;

  /* =========================
     PEAU — SOLAIRE (BASE)
  ========================= */
  const sunSkin = ctx.createRadialGradient(
    hx, hy - r*0.25, r*0.15,
    hx, hy, r*1.4
  );

  sunSkin.addColorStop(
    0,
    `rgb(${255}, ${235 + sun*15}, ${170 + sun*10})`
  );
  sunSkin.addColorStop(
    0.55,
    `rgb(${245}, ${200 + sun*25}, ${120 + sun*15})`
  );
  sunSkin.addColorStop(
    1,
    `rgb(${210}, ${150 + sun*20}, ${80 + sun*10})`
  );

  ctx.fillStyle = sunSkin;
  ctx.beginPath();
  ctx.arc(hx, hy, r*1.03, 0, Math.PI*2);
  ctx.fill();

  /* =========================
     HALO SOLAIRE
  ========================= */
  const sunHalo = ctx.createRadialGradient(
    hx, hy - r*0.3, r*0.2,
    hx, hy, r*1.6
  );

  sunHalo.addColorStop(0, `rgba(255,220,120,${0.22 * sun})`);
  sunHalo.addColorStop(0.45, `rgba(255,180,80,${0.18 * sun})`);
  sunHalo.addColorStop(1, "rgba(255,200,100,0)");

  ctx.fillStyle = sunHalo;
  ctx.beginPath();
  ctx.arc(hx, hy, r*1.15, 0, Math.PI*2);
  ctx.fill();

  /* =========================
     CORE LUMINEUX
  ========================= */
  const sunCore = ctx.createRadialGradient(
    hx, hy - r*0.15, r*0.05,
    hx, hy, r*0.9
  );

  sunCore.addColorStop(0, `rgba(255,240,180,${0.22 + sun*0.18})`);
  sunCore.addColorStop(1, "rgba(255,255,255,0)");

  ctx.fillStyle = sunCore;
  ctx.beginPath();
  ctx.arc(hx, hy, r*0.95, 0, Math.PI*2);
  ctx.fill();

  /* =========================
     YEUX — SOLAIRE HÉRO
  ========================= */
  function solarEye(x){
    ctx.save();
    ctx.translate(x, eyeY);

    const eyeW = r * 0.30;
    const eyeH = r * 0.22 * blink;

    // blanc
    ctx.fillStyle = "#fffdf6";
    ctx.beginPath();
    ctx.ellipse(0, 0, eyeW, eyeH, 0, 0, Math.PI * 2);
    ctx.fill();

    // iris solaire
    const iris = ctx.createRadialGradient(0,0,0,0,0,eyeW*0.7);
    iris.addColorStop(0, "#fff6b5");
    iris.addColorStop(1, "#ff9800");
    ctx.fillStyle = iris;
    ctx.beginPath();
    ctx.arc(0, 0, eyeW * 0.45, 0, Math.PI * 2);
    ctx.fill();

    // pupille
    ctx.fillStyle = "#3e2723";
    ctx.beginPath();
    ctx.arc(
      Math.sin(t*0.35) * eyeW * 0.08,
      Math.cos(t*0.3) * eyeH * 0.08,
      eyeW * 0.20,
      0, Math.PI * 2
    );
    ctx.fill();

    // reflet
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.beginPath();
    ctx.arc(-eyeW*0.18, -eyeH*0.35, eyeW*0.18, 0, Math.PI * 2);
    ctx.fill();

    // ligne manga supérieure
    ctx.strokeStyle = "rgba(120,70,20,0.55)";
    ctx.lineWidth = r * 0.05;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-eyeW*0.9, -eyeH*0.6);
    ctx.lineTo( eyeW*0.9, -eyeH*0.6);
    ctx.stroke();

    ctx.restore();
  }

  solarEye(hx - eyeOffset);
  solarEye(hx + eyeOffset);

  /* =========================
     SOURCILS — HÉROS CONFIANT
  ========================= */
  ctx.strokeStyle = "rgba(255,170,70,0.95)";
  ctx.lineWidth = r * 0.09;
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.moveTo(hx - r*0.55, eyeY - r*0.36);
  ctx.lineTo(hx - r*0.18, eyeY - r*0.28);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(hx + r*0.55, eyeY - r*0.36);
  ctx.lineTo(hx + r*0.18, eyeY - r*0.28);
  ctx.stroke();

  /* =========================
     BOUCHE — ASSURANCE SOLAIRE
  ========================= */
  const mouthY = hy + r * 0.40;
  const mood = Math.sin(t * 0.6) * r * 0.02;

  ctx.strokeStyle = "rgba(90,55,25,0.7)";
  ctx.lineWidth = r * 0.09;
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.moveTo(hx - r*0.20, mouthY);
  ctx.quadraticCurveTo(
    hx,
    mouthY + r*0.08 + mood,
    hx + r*0.20,
    mouthY
  );
  ctx.stroke();
}




function drawForestFace(ctx, hx, hy, r){
  const t = fxTime;

  /* =========================
     ÉNERGIE VÉGÉTALE (SÈVE)
  ========================= */
  const sap = 0.55 + Math.sin(t * 0.5) * 0.45;

  /* =========================
     POSITION GLOBALE
  ========================= */
  const eyeY = hy - r * 0.18;
  const eyeOffset = r * 0.48;

  /* =========================
     BLINK — VIVANT / ANIMAL
  ========================= */
  const blink =
    Math.sin(t * 1.8 + Math.sin(t * 0.35) * 2.6) > 0.90
      ? 0.14
      : 1;

  /* =========================
     PEAU — MOUSSE / ÉCORCE
  ========================= */
  const forestSkin = ctx.createRadialGradient(
    hx, hy - r*0.25, r*0.18,
    hx, hy, r*1.5
  );

  // cœur mousse clair
  forestSkin.addColorStop(
    0,
    `rgb(${145 + sap*20}, ${185 + sap*25}, ${120 + sap*15})`
  );
  // vert feuille
  forestSkin.addColorStop(
    0.55,
    `rgb(${95 + sap*30}, ${145 + sap*35}, ${80 + sap*25})`
  );
  // bord terre / ombre
  forestSkin.addColorStop(
    1,
    `rgb(${55 + sap*25}, ${95 + sap*30}, ${55 + sap*20})`
  );

  ctx.fillStyle = forestSkin;
  ctx.beginPath();
  ctx.arc(hx, hy, r*1.05, 0, Math.PI*2);
  ctx.fill();

  /* =========================
     HALO — CANOPÉE (OMBRE VIVANTE)
  ========================= */
  const forestHalo = ctx.createRadialGradient(
    hx, hy - r*0.35, r*0.3,
    hx, hy, r*1.7
  );

  forestHalo.addColorStop(0, `rgba(120,180,130,${0.18 * sap})`);
  forestHalo.addColorStop(0.45, `rgba(70,120,80,${0.14 * sap})`);
  forestHalo.addColorStop(1, "rgba(40,70,45,0)");

  ctx.fillStyle = forestHalo;
  ctx.beginPath();
  ctx.arc(hx, hy, r*1.2, 0, Math.PI*2);
  ctx.fill();

  /* =========================
     CORE — SÈVE INTERNE
  ========================= */
  const forestCore = ctx.createRadialGradient(
    hx, hy - r*0.12, r*0.05,
    hx, hy, r*0.85
  );

  forestCore.addColorStop(
    0,
    `rgba(190,230,170,${0.20 + sap*0.20})`
  );
  forestCore.addColorStop(
    1,
    "rgba(190,230,170,0)"
  );

  ctx.fillStyle = forestCore;
  ctx.beginPath();
  ctx.arc(hx, hy, r*0.95, 0, Math.PI*2);
  ctx.fill();

  /* =========================
     YEUX — FEUILLE / SÈVE
  ========================= */
  function forestEye(x){
    ctx.save();
    ctx.translate(x, eyeY);

    const eyeW = r * 0.28;
    const eyeH = r * 0.22 * blink;

    // blanc verdâtre (pas blanc pur)
    ctx.fillStyle = "#e6f2e4";
    ctx.beginPath();
    ctx.ellipse(0, 0, eyeW, eyeH, 0, 0, Math.PI*2);
    ctx.fill();

    // iris feuille
    const iris = ctx.createRadialGradient(0,0,0,0,0,eyeW*0.7);
    iris.addColorStop(0, "#b6f2c2");
    iris.addColorStop(1, "#1b5e20");
    ctx.fillStyle = iris;
    ctx.beginPath();
    ctx.arc(0, 0, eyeW * 0.46, 0, Math.PI*2);
    ctx.fill();

    // pupille sombre
    ctx.fillStyle = "#0b2a14";
    ctx.beginPath();
    ctx.arc(
      Math.sin(t*0.45) * eyeW * 0.10,
      Math.cos(t*0.35) * eyeH * 0.10,
      eyeW * 0.20,
      0, Math.PI*2
    );
    ctx.fill();

    // reflet réduit (organique)
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    ctx.beginPath();
    ctx.arc(-eyeW*0.16, -eyeH*0.32, eyeW*0.14, 0, Math.PI*2);
    ctx.fill();

    // paupière feuille
    ctx.strokeStyle = "rgba(20,60,35,0.55)";
    ctx.lineWidth = r * 0.05;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-eyeW*0.9, -eyeH*0.6);
    ctx.lineTo( eyeW*0.9, -eyeH*0.6);
    ctx.stroke();

    ctx.restore();
  }

  forestEye(hx - eyeOffset);
  forestEye(hx + eyeOffset);

  /* =========================
     SOURCILS — BRANCHES
  ========================= */
  ctx.strokeStyle = "rgba(30,80,45,0.6)";
  ctx.lineWidth = r * 0.075;
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.moveTo(hx - r*0.55, eyeY - r*0.32);
  ctx.quadraticCurveTo(
    hx - r*0.35,
    eyeY - r*0.42,
    hx - r*0.18,
    eyeY - r*0.30
  );
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(hx + r*0.55, eyeY - r*0.32);
  ctx.quadraticCurveTo(
    hx + r*0.35,
    eyeY - r*0.42,
    hx + r*0.18,
    eyeY - r*0.30
  );
  ctx.stroke();

  /* =========================
     BOUCHE — FEUILLE SOUPLE
  ========================= */
  const mouthY = hy + r * 0.40;
  const mood = Math.sin(t * 0.7) * r * 0.03;

  ctx.strokeStyle = "rgba(25,70,40,0.7)";
  ctx.lineWidth = r * 0.08;
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.moveTo(hx - r*0.20, mouthY);
  ctx.quadraticCurveTo(
    hx,
    mouthY + r*0.10 + mood,
    hx + r*0.20,
    mouthY
  );
  ctx.stroke();
}



function drawArcticFace(ctx, hx, hy, r){
  const t = fxTime;

  /* =========================
     ÉNERGIE POLAIRE
  ========================= */
  const cold = 0.6 + Math.sin(t * 0.55) * 0.4;

  /* =========================
     POSITION GLOBALE
  ========================= */
  const eyeY  = hy - r * 0.26;
  const eyeDX = r * 0.50;

  /* =========================
     BLINK — DOMINANT & RARE
  ========================= */
  const blink =
    Math.sin(t * 1.6) > 0.985
      ? 0.10
      : 1;

  const gaze = Math.sin(t * 0.35) * r * 0.03;

  /* =========================
     PEAU — GLACE COMPACTE
  ========================= */
  const iceSkin = ctx.createRadialGradient(
    hx, hy - r*0.30, r*0.18,
    hx, hy, r*1.45
  );

  iceSkin.addColorStop(
    0,
    `rgb(${225 + cold*15}, ${245 + cold*10}, ${255})`
  );
  iceSkin.addColorStop(
    0.55,
    `rgb(${170 + cold*25}, ${215 + cold*30}, ${245 + cold*20})`
  );
  iceSkin.addColorStop(
    1,
    `rgb(${110 + cold*25}, ${160 + cold*30}, ${200 + cold*20})`
  );

  ctx.fillStyle = iceSkin;
  ctx.beginPath();
  ctx.arc(hx, hy, r*1.05, 0, Math.PI*2);
  ctx.fill();

  /* =========================
     HALO — AIR GLACIAL
  ========================= */
  const iceHalo = ctx.createRadialGradient(
    hx, hy - r*0.35, r*0.25,
    hx, hy, r*1.7
  );

  iceHalo.addColorStop(0, `rgba(220,245,255,${0.18 * cold})`);
  iceHalo.addColorStop(0.45, `rgba(140,200,240,${0.14 * cold})`);
  iceHalo.addColorStop(1, "rgba(120,170,210,0)");

  ctx.fillStyle = iceHalo;
  ctx.beginPath();
  ctx.arc(hx, hy, r*1.2, 0, Math.PI*2);
  ctx.fill();

  /* =========================
     CORE — FROID DENSE
  ========================= */
  const iceCore = ctx.createRadialGradient(
    hx, hy - r*0.15, r*0.05,
    hx, hy, r*0.95
  );

  iceCore.addColorStop(
    0,
    `rgba(245,255,255,${0.22 + cold*0.18})`
  );
  iceCore.addColorStop(
    1,
    "rgba(245,255,255,0)"
  );

  ctx.fillStyle = iceCore;
  ctx.beginPath();
  ctx.arc(hx, hy, r*0.98, 0, Math.PI*2);
  ctx.fill();

  /* =========================
     YEUX — SENTINELLE POLAIRE
  ========================= */
  function arcticEye(x){
    ctx.save();
    ctx.translate(x + gaze, eyeY);

    const w = r * 0.42;
    const h = r * 0.18 * blink;

    // fente
    ctx.fillStyle = "#e9faff";
    ctx.beginPath();
    ctx.ellipse(0, 0, w, h, 0, 0, Math.PI*2);
    ctx.fill();

    // anneau glacé
    const ring = ctx.createRadialGradient(0,0,w*0.18, 0,0,w*0.55);
    ring.addColorStop(0, "rgba(255,255,255,0)");
    ring.addColorStop(0.35, "#d8f6ff");
    ring.addColorStop(0.6, "#8bd9ff");
    ring.addColorStop(0.85, "#3c8fc4");
    ring.addColorStop(1, "#0b2a3d");

    ctx.strokeStyle = ring;
    ctx.lineWidth = r * 0.13;
    ctx.beginPath();
    ctx.arc(0, 0, w*0.42, 0, Math.PI*2);
    ctx.stroke();

    // noyau
    ctx.fillStyle = "#061823";
    ctx.beginPath();
    ctx.arc(0, 0, w*0.12, 0, Math.PI*2);
    ctx.fill();

    // paupière dominante
    ctx.strokeStyle = "#9fe5ff";
    ctx.lineWidth = r * 0.14;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-w*1.15, -h*0.80);
    ctx.lineTo( w*1.15, -h*0.90);
    ctx.stroke();

    ctx.restore();
  }

  arcticEye(hx - eyeDX);
  arcticEye(hx + eyeDX);

  /* =========================
     BOUCHE — FISSURE GLACÉE
  ========================= */
  const mouthY = hy + r * 0.58;
  const pulse = (Math.sin(t * 1.3) + 1) * 0.5;

  const mw = r * 0.36;
  const mh = r * (0.06 + pulse * 0.035);

  const crack = ctx.createLinearGradient(
    hx - mw, mouthY,
    hx + mw, mouthY
  );
  crack.addColorStop(0, "rgba(170,235,255,0)");
  crack.addColorStop(0.45, "rgba(230,250,255,0.95)");
  crack.addColorStop(0.55, "rgba(230,250,255,0.95)");
  crack.addColorStop(1, "rgba(170,235,255,0)");

  ctx.fillStyle = crack;
  ctx.beginPath();
  ctx.ellipse(hx, mouthY, mw, mh, 0, 0, Math.PI*2);
  ctx.fill();

  /* =========================
     SOUFFLE GLACIAL
  ========================= */
  const breath = Math.max(0, Math.sin(t * 2.1));
  if(breath > 0.4){
    ctx.fillStyle = `rgba(220,245,255,${(breath-0.4)*0.35})`;
    ctx.beginPath();
    ctx.ellipse(
      hx,
      mouthY + r*0.10,
      r*0.32 * breath,
      r*0.18 * breath,
      0, 0, Math.PI*2
    );
    ctx.fill();
  }

  /* =========================
     GIVRE — POMMETTES
  ========================= */
  ctx.fillStyle = "rgba(200,240,255,0.35)";
  ctx.beginPath();
  ctx.arc(hx - r*0.58, eyeY + r*0.15, r*0.075, 0, Math.PI*2);
  ctx.arc(hx + r*0.58, eyeY + r*0.15, r*0.075, 0, Math.PI*2);
  ctx.fill();
}



let neonFace = 0;
let neonNext = 0;
let neonFlickEnd = 0;
function drawNeonFace(ctx, hx, hy, r){
  const t = fxTime;

  /* =========================
     SCHEDULER ENSEIGNE
  ========================= */
  if (t > neonNext){
    neonFace = (neonFace + 1 + Math.floor(Math.random()*3)) % 4;
    neonFlickEnd = t + 0.25 + Math.random()*0.25;
    neonNext = t + 2.5 + Math.random()*2.5;
  }

  const inFlicker = t < neonFlickEnd;

  let power;
  if (inFlicker){
    power = Math.random() < 0.25 ? 0 : 0.4 + Math.random()*0.4;
  } else {
    power = 0.9 + Math.sin(t*18)*0.06 + Math.sin(t*42)*0.04;
  }

  /* =========================
     PALETTES
  ========================= */
  const HEAD = "#3dfcff";

  const PALETTES = [
    { eye:"#7dfcff", mouth:"#5fb8ff", accent:null },      // HAPPY
    { eye:"#c77dff", mouth:"#7b2cff", accent:"#7dfcff" }, // SAD
    { eye:"#ff3b3b", mouth:"#b30000", accent:null },      // DEAD
    { eye:"#ffe066", mouth:"#7dfcff", accent:"#ff5fa2" }  // WINK
  ];

  const P = PALETTES[neonFace];

  ctx.save();
  ctx.globalAlpha = power;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  /* =========================
     TÊTE — TUBE NÉON
  ========================= */
  ctx.strokeStyle = HEAD;
  ctx.lineWidth   = r * 0.12;
  ctx.shadowColor = HEAD;
  ctx.shadowBlur  = r * 0.55 * power;

  ctx.beginPath();
  ctx.arc(hx, hy, r*0.9, 0, Math.PI*2);
  ctx.stroke();

  /* =========================
     BLINK GLOBAL (YEUX)
  ========================= */
  const blink =
    Math.sin(t*2.4 + Math.sin(t*0.6)*2.2) > 0.94 ? 0.18 : 1;

  /* =========================
     YEUX — ROBOT NÉON
  ========================= */
  const eyeY = hy - r*0.22;
  const dx   = r*0.32;

  function drawEye(x, closed=false){
    ctx.save();
    ctx.translate(x, eyeY);
    ctx.scale(1, closed ? 0.15 : blink);

    const size = r * 0.10;
    const inner = size * 0.55;

    // cadre externe
    ctx.strokeStyle = P.eye;
    ctx.lineWidth = r * 0.045;
    ctx.shadowColor = P.eye;
    ctx.shadowBlur = r * 0.45 * power;

    ctx.beginPath();
    ctx.roundRect(-size, -size, size*2, size*2, r*0.04);
    ctx.stroke();

    // cadre interne
    ctx.lineWidth = r * 0.018;
    ctx.beginPath();
    ctx.roundRect(-inner, -inner, inner*2, inner*2, r*0.03);
    ctx.stroke();

    // pupille lumineuse (pas pour DEAD)
    if (neonFace !== 2 && !closed){
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "#ffffff";
      ctx.shadowBlur = r * 0.25 * power;

      ctx.beginPath();
      ctx.arc(
        Math.sin(t*1.2) * inner * 0.25,
        Math.cos(t*1.1) * inner * 0.25,
        inner * 0.25,
        0, Math.PI*2
      );
      ctx.fill();
    }

    ctx.restore();
  }

  if (neonFace === 3){ // WINK
    drawEye(hx-dx, true);
    drawEye(hx+dx, false);
  } else {
    drawEye(hx-dx, false);
    drawEye(hx+dx, false);
  }

  /* =========================
     BOUCHE — DOUBLE TUBE
  ========================= */
  const my = hy + r*0.28;

  ctx.strokeStyle = P.mouth;
  ctx.shadowColor = P.mouth;
  ctx.shadowBlur  = r * 0.45 * power;

  // tube externe
  ctx.lineWidth = r * 0.09;
  ctx.beginPath();

  if (neonFace === 0){ // HAPPY
    ctx.arc(hx, my, r*0.30, 0, Math.PI, false);
  }
  if (neonFace === 1){ // SAD
    ctx.arc(hx, my+r*0.14, r*0.30, Math.PI, 0, false);
  }
  if (neonFace === 2){ // DEAD
    ctx.moveTo(hx-r*0.22, my);
    ctx.lineTo(hx+r*0.22, my);
  }
  if (neonFace === 3){ // WINK
    ctx.arc(hx, my, r*0.26, 0, Math.PI, false);
  }
  ctx.stroke();

  // tube interne
  ctx.lineWidth = r * 0.028;
  ctx.shadowBlur = r * 0.25 * power;
  ctx.beginPath();

  if (neonFace === 0){
    ctx.arc(hx, my, r*0.30, 0, Math.PI, false);
  }
  if (neonFace === 1){
    ctx.arc(hx, my+r*0.14, r*0.30, Math.PI, 0, false);
  }
  if (neonFace === 2){
    ctx.moveTo(hx-r*0.20, my);
    ctx.lineTo(hx+r*0.20, my);
  }
  if (neonFace === 3){
    ctx.arc(hx, my, r*0.26, 0, Math.PI, false);
  }
  ctx.stroke();

  /* =========================
     LANGUE — ACCENT
  ========================= */
  if (neonFace === 3){
    ctx.strokeStyle = P.accent;
    ctx.shadowColor = P.accent;
    ctx.shadowBlur  = r * 0.35 * power;
    ctx.lineWidth   = r * 0.06;

    ctx.beginPath();
    ctx.moveTo(hx, my+r*0.06);
    ctx.lineTo(hx, my+r*0.16);
    ctx.stroke();
  }

  ctx.restore();
}



function drawVoidFace(ctx, hx, hy, r){
  const t = fxTime;
  const R = r * 0.9;

  ctx.save();

  /* =====================================================
     🟡 VISAGE — SUPER SKIN ÉVOLUTIF (16s)
     OR → ARGENT → VIOLET → BLANC
  ===================================================== */
  const cycle = (Math.sin(t * 0.25) + 1) * 0.5; // lent ≈ 16s
  let c1, c2, c3;

  if(cycle < 0.25){
    // OR
    const k = cycle / 0.25;
    c1 = `rgb(${255}, ${245 - 15*k}, ${210 - 40*k})`;
    c2 = `rgb(${235 - 20*k}, ${205 - 30*k}, ${140 - 60*k})`;
    c3 = `rgb(120,85,25)`;
  }
  else if(cycle < 0.5){
    // ARGENT
    const k = (cycle - 0.25) / 0.25;
    c1 = `rgb(${230 + 15*k}, ${235 + 15*k}, ${240 + 15*k})`;
    c2 = `rgb(${200 + 20*k}, ${205 + 20*k}, ${210 + 20*k})`;
    c3 = `rgb(140,145,150)`;
  }
  else if(cycle < 0.75){
    // VIOLET FLASHY LUXE
    const k = (cycle - 0.5) / 0.25;
    c1 = `rgb(${220 + 20*k}, ${190 - 30*k}, ${255})`;
    c2 = `rgb(${170 + 20*k}, ${110 - 20*k}, ${220})`;
    c3 = `rgb(${90}, ${40}, ${140})`;
  }
  else{
    // BLANC (APOGÉE)
    const k = (cycle - 0.75) / 0.25;
    c1 = `rgb(255,255,255)`;
    c2 = `rgb(${245 - 20*k}, ${245 - 20*k}, ${245 - 20*k})`;
    c3 = `rgb(${160 - 40*k}, ${160 - 40*k}, ${160 - 40*k})`;
  }

  const face = ctx.createRadialGradient(
    hx + Math.sin(t*0.4)*R*0.05,
    hy - R*0.25,
    R*0.15,
    hx,
    hy,
    R
  );
  face.addColorStop(0, c1);
  face.addColorStop(0.45, c2);
  face.addColorStop(1, c3);

  ctx.fillStyle = face;
  ctx.beginPath();
  ctx.arc(hx, hy, R, 0, Math.PI*2);
  ctx.fill();

  /* =====================================================
     LUEUR INTERNE SYNCHRO (PLUS FORTE EN VIOLET & BLANC)
  ===================================================== */
  let glowBoost = 0.18;
  if(cycle > 0.5) glowBoost = 0.28;
  if(cycle > 0.75) glowBoost = 0.38;

  ctx.globalAlpha = glowBoost;
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.beginPath();
  ctx.arc(hx, hy, R*0.72, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha = 1;

  /* =====================================================
     👑 COURONNE — INCHANGÉE (VALIDÉE)
  ===================================================== */
  const crownY = hy - R*0.62;
  const outerR = R * 0.92;
  const innerR = R * 0.78;

  const crownMat = ctx.createLinearGradient(
    0, crownY - R*0.15,
    0, crownY + R*0.15
  );
  crownMat.addColorStop(0, "rgb(255,230,160)");
  crownMat.addColorStop(0.5, "rgb(200,150,60)");
  crownMat.addColorStop(1, "rgb(120,85,25)");

  ctx.fillStyle = crownMat;
  ctx.beginPath();
  ctx.arc(hx, crownY, outerR, Math.PI*1.05, Math.PI*1.95);
  ctx.arc(hx, crownY, innerR, Math.PI*1.95, Math.PI*1.05, true);
  ctx.closePath();
  ctx.fill();

  /* =====================================================
     👁️ YEUX — INCHANGÉS (VALIDÉS)
  ===================================================== */
  const blink = Math.abs(Math.sin(t*1.2)) > 0.96 ? 0.25 : 1;
  const eyeY = hy - R*0.02;
  const dx = R*0.34;
  const ew = R*0.36;
  const eh = R*0.22 * blink;

  function eye(x){
    ctx.save();
    ctx.translate(x, eyeY);
    ctx.fillStyle = "rgb(245,245,245)";
    ctx.beginPath();
    ctx.ellipse(0,0,ew,eh,0,0,Math.PI*2);
    ctx.fill();

    if(blink > 0.3){
      ctx.fillStyle = "rgb(170,215,255)";
      ctx.beginPath();
      ctx.ellipse(0,0,ew*0.55,eh*0.55,0,0,Math.PI*2);
      ctx.fill();

      ctx.fillStyle = "rgb(0,0,0)";
      ctx.beginPath();
      ctx.arc(0,0,ew*0.25,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  eye(hx - dx);
  eye(hx + dx);

  /* =====================================================
     😐 BOUCHE — INCHANGÉE
  ===================================================== */
  ctx.strokeStyle = "rgba(40,30,10,0.9)";
  ctx.lineWidth = R*0.08;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(hx - R*0.22, hy + R*0.34);
  ctx.lineTo(hx + R*0.22, hy + R*0.34);
  ctx.stroke();

  /* =====================================================
     ⚡ AURA — LUXE (ARGENT / BLANC / OR / VIOLET)
  ===================================================== */
  ctx.lineCap = "round";
  for(let i=0;i<22;i++){
    const a = Math.random()*Math.PI*2;
    let x = hx + Math.cos(a)*R*1.1;
    let y = hy + Math.sin(a)*R*1.1;

    const roll = Math.random();
    let color, width;

    if(roll < 0.25){
      color = "rgba(210,220,230,0.95)"; // argent
      width = R*0.04;
    }else if(roll < 0.5){
      color = "rgba(255,255,255,0.95)"; // blanc
      width = R*0.045;
    }else if(roll < 0.75){
      color = "rgba(255,220,140,0.95)"; // or
      width = R*0.05;
    }else{
      color = "rgba(200,150,255,0.95)"; // violet
      width = R*0.05;
    }

    ctx.strokeStyle = color;
    ctx.lineWidth = width;

    ctx.beginPath();
    ctx.moveTo(x,y);
    for(let k=0;k<3;k++){
      x += (Math.random()-0.5)*R*0.6;
      y += (Math.random()-0.5)*R*0.6;
      ctx.lineTo(x,y);
    }
    ctx.stroke();
  }

  ctx.restore();
}


function drawInfernoFace(ctx, hx, hy, r){
  const t = performance.now() * 0.001;

  /* =========================
     HEAT — COLÈRE VIVANTE
  ========================= */
  const heat = 0.5 + Math.sin(t*0.6)*0.5;

  /* =========================
     BLINK — RARE & NERVEUX
  ========================= */
  const blink =
    Math.sin(t * 3.2 + Math.sin(t * 0.7) * 2.1) > 0.94
      ? 0.12
      : 1;

  /* =========================
     PEAU — TRANSITION RÉELLE
  ========================= */
  const skin = ctx.createRadialGradient(
    hx, hy-r*0.2, r*0.2,
    hx, hy, r*1.4
  );

  skin.addColorStop(0, `rgb(${180+heat*60}, ${90-heat*40}, ${70-heat*60})`);
  skin.addColorStop(0.6, `rgb(${120+heat*80}, ${50-heat*30}, ${40-heat*40})`);
  skin.addColorStop(1, `rgb(${60+heat*40}, 20, 15)`);

  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.arc(hx, hy, r*1.02, 0, Math.PI*2);
  ctx.fill();

  /* =========================
     YEUX — ANGRY RÉELS
  ========================= */
  const eyeY = hy - r*0.22;
  const dx = r*0.45;

  function eye(x){
    ctx.save();
    ctx.translate(x, eyeY);

    const w = r*0.32;
    const h = r*(0.12 + heat*0.06) * blink;

    // base
    ctx.fillStyle = "#2a0000";
    ctx.beginPath();
    ctx.ellipse(0,0,w,h,0,0,Math.PI*2);
    ctx.fill();

    if(blink > 0.2){
      // iris feu
      const iris = ctx.createRadialGradient(0,0,0,0,0,w*0.6);
      iris.addColorStop(0, "#fff0c0");
      iris.addColorStop(0.4, "#ff5200");
      iris.addColorStop(1, "#600000");
      ctx.fillStyle = iris;
      ctx.beginPath();
      ctx.arc(0,0,w*0.42,0,Math.PI*2);
      ctx.fill();

      // pupille fente
      ctx.fillStyle = "#120000";
      ctx.beginPath();
      ctx.ellipse(0,0,w*0.06,h*1.8,0,0,Math.PI*2);
      ctx.fill();
    }

    // sourcil (clé de l’angry)
    ctx.strokeStyle = "#200000";
    ctx.lineWidth = r*0.09;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-w, -h*1.1);
    ctx.lineTo(w, -h*(1.6+heat*0.4));
    ctx.stroke();

    ctx.restore();
  }

  eye(hx-dx);
  eye(hx+dx);

/* =========================
   BOUCHE — RICTUS DE COIN
========================= */
const mouthY = hy + r*0.42;
const mw = r*0.34;

// intensité du rictus
const curl = heat * r * 0.14;

// micro vibration nerveuse
const twitch = Math.sin(t * 5.5) * r * 0.012;

// coin actif (droite par défaut)
const side = 1; // -1 = gauche

// ligne principale (tendue)
ctx.strokeStyle = "#1a0000";
ctx.lineWidth = r * 0.085;
ctx.lineCap = "round";
ctx.beginPath();

// point gauche (tendu, bas)
ctx.moveTo(
  hx - mw,
  mouthY + curl*0.15
);

// contrôle central (bouche fermée)
ctx.quadraticCurveTo(
  hx,
  mouthY - curl*0.25,
  // coin droit relevé et tiré
  hx + mw,
  mouthY - curl*0.9 - twitch
);
ctx.stroke();

// pli du rictus (clé visuelle)
ctx.strokeStyle = "rgba(0,0,0,0.45)";
ctx.lineWidth = r * 0.045;
ctx.beginPath();
ctx.moveTo(
  hx + side * mw * 0.55,
  mouthY - curl*0.25
);
ctx.lineTo(
  hx + side * mw * 0.72,
  mouthY - curl*0.75
);
ctx.stroke();

// ombre sous lèvre (pression)
ctx.strokeStyle = "rgba(0,0,0,0.35)";
ctx.lineWidth = r * 0.05;
ctx.beginPath();
ctx.moveTo(
  hx - mw * 0.85,
  mouthY + r * 0.03
);
ctx.quadraticCurveTo(
  hx,
  mouthY + curl * 0.45,
  hx + mw * 0.8,
  mouthY + r * 0.02
);
ctx.stroke();

// souffle chaud discret
const mouthGlow = ctx.createRadialGradient(
  hx + side * mw * 0.55,
  mouthY - curl * 0.4,
  r * 0.05,
  hx,
  mouthY,
  r * 0.7
);
mouthGlow.addColorStop(0, `rgba(255,90,40,${0.18+heat*0.22})`);
mouthGlow.addColorStop(1, "rgba(0,0,0,0)");
ctx.fillStyle = mouthGlow;
ctx.fillRect(
  hx - mw * 1.2,
  mouthY - curl * 1.2,
  mw * 2.4,
  curl * 2.4
)

}





// --- Effets par SKIN (même silhouette, déco premium) — OPTIMISÉ SANS PERTE VISUELLE ---
const _moonyHaloCache = new Map();

function drawMoonyFX(ctx, bx, by, bw, bh, t, isPreview = false){
  ctx.save();

  const cx = bx + bw/2;
  const cy = by + bh/2 + bh*0.1;

  const pulse = 0.85 + Math.sin(t*1.8)*0.15;

  /* === HALO LUNAIRE ARRIÈRE (SILHOUETTE) === */
  const rY = bh * (isPreview ? 1.05 : 1.25);
  const rX = bw * 1.05;

  const key = `${bw}|${bh}|${isPreview?1:0}`;
  let g = _moonyHaloCache.get(key);
  if (!g){
    g = ctx.createRadialGradient(cx, cy, bh*0.15, cx, cy, rY);
    g.addColorStop(0, "rgba(255,245,210,0.55)");
    g.addColorStop(0.45, "rgba(180,200,255,0.25)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    if (_moonyHaloCache.size > 12) _moonyHaloCache.clear();
    _moonyHaloCache.set(key, g);
  }

  ctx.globalAlpha = pulse * (isPreview ? 0.55 : 0.85);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(cx, cy, rX, rY, 0, 0, Math.PI*2);
  ctx.fill();

  /* === PARTICULES LUNAIRES ORBITALES === */
  if (!isPreview){
    ctx.globalAlpha = 0.75;
    ctx.fillStyle = "rgba(255,250,230,0.95)";

    const baseA = t*0.6;
    const r = bw*0.55;
    for(let i=0;i<4;i++){
      const a = baseA + i*(Math.PI*0.5);
      const px = cx + Math.cos(a)*r;
      const py = cy + Math.sin(a)*r*0.7;

      ctx.beginPath();
      ctx.arc(px, py, 1.1, 0, Math.PI*2);
      ctx.fill();
    }
  }

  ctx.restore();
}




// --- Forest FX — OPTIMISÉ (VISUEL IDENTIQUE, CPU DIVISÉ) ---
const _forestGradCache = new Map();

function _getForestGrad(ctx, key, maker){
  let g = _forestGradCache.get(key);
  if (!g){
    g = maker();
    if (_forestGradCache.size > 24) _forestGradCache.clear();
    _forestGradCache.set(key, g);
  }
  return g;
}

function drawForestFX(ctx, bx, by, bw, bh, t, isPreview = false){
  ctx.save();

  const cx = bx + bw*0.5;
  const cy = by + bh*0.5;
  const R  = Math.min(bw, bh) * 0.82;

  const time = (t > 100 ? t : t*1000) * 0.001;
  const I = isPreview ? 0.65 : 1.0;
  const TAU = Math.PI * 2;

  const clamp01 = v => Math.max(0, Math.min(1, v));
  const pulse = (s, ph=0)=> 0.5 + 0.5*Math.sin(time*s + ph);
  const soft = v => v*v*(3-2*v);
  const hash = n => { const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); };

  function leafPath(c, w, h){
    c.beginPath();
    c.moveTo(0, -h);
    c.bezierCurveTo(w*0.65, -h*0.65, w, -h*0.10, 0, h);
    c.bezierCurveTo(-w, -h*0.10, -w*0.65, -h*0.65, 0, -h);
    c.closePath();
  }

  function runeStroke(c, x, y, s, rot){
    c.save();
    c.translate(x,y);
    c.rotate(rot);
    c.lineWidth = 1.15 * I;
    c.lineCap = "round";
    c.beginPath();
    c.moveTo(-s*0.6, -s*0.25);
    c.lineTo( s*0.25, -s*0.25);
    c.lineTo( s*0.25,  s*0.55);
    c.moveTo(-s*0.2,  s*0.1);
    c.lineTo( s*0.6,  s*0.1);
    c.stroke();
    c.restore();
  }

  /* ===== 0) FOG / AURA (CACHE) ===== */
  const breathe = 0.86 + 0.14*Math.sin(time*1.7);
  const fog = _getForestGrad(
    ctx,
    `fog_${bw}_${bh}_${I}`,
    ()=> {
      const g = ctx.createRadialGradient(cx, cy, R*0.10, cx, cy, R*1.25);
      g.addColorStop(0.00, `rgba(220,255,235,${0.18*I})`);
      g.addColorStop(0.28, `rgba(130,220,170,${0.18*I})`);
      g.addColorStop(0.60, `rgba(35,110,75,${0.20*I})`);
      g.addColorStop(1.00, "rgba(0,0,0,0)");
      return g;
    }
  );

  ctx.globalAlpha = breathe;
  ctx.fillStyle = fog;
  ctx.beginPath();
  ctx.arc(cx, cy, R*1.25, 0, TAU);
  ctx.fill();

  /* ===== 1) VORTEX ORGANIQUE ===== */
  ctx.globalCompositeOperation = "screen";
  ctx.globalAlpha = 0.55 * I;

  const swirl = _getForestGrad(
    ctx,
    `swirl_${bw}_${bh}_${I}`,
    ()=> {
      const g = ctx.createRadialGradient(cx, cy, R*0.15, cx, cy, R*1.05);
      g.addColorStop(0.00, "rgba(255,255,255,0)");
      g.addColorStop(0.35, `rgba(150,255,205,${0.18*I})`);
      g.addColorStop(0.70, `rgba(80,190,130,${0.14*I})`);
      g.addColorStop(1.00, "rgba(0,0,0,0)");
      return g;
    }
  );

  const sx = cx + Math.sin(time*1.2)*R*0.02;
  const sy = cy + Math.cos(time*1.0)*R*0.02;

  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(time*0.22);
  ctx.scale(1.05, 0.82);
  ctx.fillStyle = swirl;
  ctx.beginPath();
  ctx.arc(0, 0, R*1.05, 0, TAU);
  ctx.fill();
  ctx.restore();

  ctx.globalCompositeOperation = "source-over";

  /* ===== 2) SCEAU DRUIDIQUE ===== */
  const ringRot = time * 0.35;
  const ringPulse = 0.75 + 0.25*pulse(2.6, 0.4);

  ctx.globalCompositeOperation = "screen";
  ctx.globalAlpha = (isPreview ? 0.38 : 0.62) * I * ringPulse;

  ctx.lineWidth = 2.4 * I;
  const ringG = _getForestGrad(
    ctx,
    `ring_${bw}_${bh}_${I}`,
    ()=> {
      const g = ctx.createRadialGradient(cx, cy, R*0.70, cx, cy, R*1.02);
      g.addColorStop(0.0, `rgba(170,255,220,${0.10*I})`);
      g.addColorStop(0.55,`rgba(110,235,170,${0.42*I})`);
      g.addColorStop(1.0, "rgba(0,0,0,0)");
      return g;
    }
  );
  ctx.strokeStyle = ringG;
  ctx.beginPath();
  ctx.arc(cx, cy, R*0.92, 0, TAU);
  ctx.stroke();

  ctx.globalCompositeOperation = "source-over";

  /* ===== 3) RUNES ===== */
  const runeCount = isPreview ? 10 : 16;
  ctx.globalAlpha = (isPreview ? 0.42 : 0.70) * I;
  ctx.strokeStyle = "rgba(200,255,230,0.85)";
  for(let i=0;i<runeCount;i++){
    const a = ringRot + i*(TAU/runeCount);
    const rr = R*0.83;
    runeStroke(
      ctx,
      cx + Math.cos(a)*rr,
      cy + Math.sin(a)*rr*0.86,
      R*(0.06 + 0.01*Math.sin(time*3 + i)),
      a + Math.PI/2
    );
  }

  /* ===== 4) FEUILLES + LUCIOLES (IDENTIQUE) ===== */
  const fireflies = isPreview ? 6 : 14;
  ctx.globalCompositeOperation = "screen";
  for(let i=0;i<fireflies;i++){
    const seed = i*19.73;
    const a = time*(0.7 + 0.03*i) + seed;
    const rr = R*(0.20 + 0.55*hash(seed+1));
    const x = cx + Math.cos(a)*rr;
    const y = cy + Math.sin(a*1.18)*rr*0.78;
    const tw = clamp01(0.25 + 0.75*pulse(5.0, i*1.4));
    const r = (isPreview ? 1.4 : 2.0) * (0.7 + tw) * I;

    ctx.globalAlpha = (isPreview ? 0.55 : 0.85) * tw * I;
    ctx.fillStyle = "rgba(210,255,235,1)";
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();

    ctx.globalAlpha *= 0.25;
    ctx.beginPath();
    ctx.arc(x, y, r*3.0, 0, TAU);
    ctx.fill();
  }

  /* ===== 5) COEUR ===== */
  ctx.globalCompositeOperation = "screen";
  const corePulse = 0.55 + 0.45*Math.sin(time*3.1);

  const coreG = _getForestGrad(
    ctx,
    `core_${bw}_${bh}_${I}`,
    ()=> {
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R*0.46);
      g.addColorStop(0.0, `rgba(235,255,245,${0.22*corePulse*I})`);
      g.addColorStop(0.35,`rgba(170,255,215,${0.14*I})`);
      g.addColorStop(1.0, "rgba(0,0,0,0)");
      return g;
    }
  );

  ctx.globalAlpha = 1;
  ctx.fillStyle = coreG;
  ctx.beginPath();
  ctx.arc(cx, cy, R*0.46, 0, TAU);
  ctx.fill();

  ctx.restore();
}

function drawSolarFX(ctx, bx, by, bw, bh, t, isPreview = false){
